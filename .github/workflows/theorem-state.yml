name: public-research-integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-localized-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Structural checks run on ordinary non-draft PRs. Package execution remains
# separately opt-in; this workflow never runs the full theorem certificate suite.
jobs:
  plan:
    name: Structural integrity and verification plan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      replay: ${{ steps.plan.outputs.replay }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch trusted base ancestry into fork checkout
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C candidate remote add e99-base "https://github.com/$GITHUB_REPOSITORY.git"
          git -C candidate fetch --no-tags e99-base "$BASE_REF"
          git -C candidate cat-file -e "$BASE_SHA^{commit}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - name: Install trusted planner dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r control/tools/requirements-integrity-linux-x86_64.lock
      - name: Ensure hosted isolation backend is available
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
      - name: Verify trusted CI control
        working-directory: control
        run: python3 -B -m unittest tools.test_local_ci -q
      - name: Plan and validate contributed metadata
        id: plan
        run: >-
          python3 -B control/tools/local_ci.py --root candidate
          --event-file "$GITHUB_EVENT_PATH" --integrity
          --output "$RUNNER_TEMP/e99-plan" --github-output "$GITHUB_OUTPUT"
      - name: Report verification scope and pending replay
        if: always()
        env:
          VERIFICATION_LEVEL: ${{ steps.plan.outputs.level }}
          REPLAY_SCHEDULE: ${{ steps.plan.outputs.replay_schedule }}
          PACKAGE_REPLAY_ENABLED: ${{ vars.E99_PUBLIC_PACKAGE_REPLAY }}
        run: |
          echo 'This job checks structural integrity and reports verification scope. It does not certify a theorem or a pending replay.' >> "$GITHUB_STEP_SUMMARY"
          if test "$VERIFICATION_LEVEL" = 'full-verification-required'; then
            echo 'Full verification or impact review remains with the merging agent.' >> "$GITHUB_STEP_SUMMARY"
          elif test "$REPLAY_SCHEDULE" = 'deferred-budget'; then
            echo 'The complete targeted replay set exceeds the automatic budget. All listed packages remain required; no partial replay ran.' >> "$GITHUB_STEP_SUMMARY"
          elif test "$REPLAY_SCHEDULE" = 'ready' && test "$PACKAGE_REPLAY_ENABLED" != 'true'; then
            echo 'Targeted replay remains pending because optional package execution is not enabled.' >> "$GITHUB_STEP_SUMMARY"
          elif test "$REPLAY_SCHEDULE" = 'ready'; then
            echo 'Targeted replay is handled by the separate package job; consult its result.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/e99-plan/plan.json"; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/e99-plan/plan.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/e99-plan/integrity.log"; then
            cat "$RUNNER_TEMP/e99-plan/integrity.log"
          fi
  replay:
    name: Optional isolated package replay
    needs: plan
    if: needs.plan.outputs.replay == 'true' && vars.E99_PUBLIC_PACKAGE_REPLAY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch trusted base ancestry into fork checkout
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C candidate remote add e99-base "https://github.com/$GITHUB_REPOSITORY.git"
          git -C candidate fetch --no-tags e99-base "$BASE_REF"
          git -C candidate cat-file -e "$BASE_SHA^{commit}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - name: Install pinned planner dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r control/tools/requirements-integrity-linux-x86_64.lock
      - name: Ensure hosted isolation backend is available
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
      - name: Recompute plan and replay selected packages without network
        run: >-
          python3 -B control/tools/local_ci.py --root candidate
          --event-file "$GITHUB_EVENT_PATH" --replay --require-localized
          --output "$RUNNER_TEMP/e99-replay"
      - name: Summarize scoped verification
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/e99-replay/replay.json"; then
            cat "$RUNNER_TEMP/e99-replay/replay.json" >> "$GITHUB_STEP_SUMMARY"
          fi

